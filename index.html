<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Asia Model Ranking</title>
<style>
:root{--bg:#080808;--fg:#fff;--mute:#aaa;--line:#333;--green:#00FD98;--pink:#FD007F;--yellow:#FDEC00}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,sans-serif}.gate{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:16px}.gate form{width:100%;max-width:360px;background:#151515;border:1px solid var(--line);padding:24px}.gate h1{font:normal 22px 'Archivo Black',Impact,sans-serif}input[type=password]{width:100%;min-height:44px;background:#0b0b0b;color:white;border:1px solid #444;padding:10px;font-size:16px}button{min-height:44px;background:#171717;color:white;border:1px solid #444;padding:8px 16px;font:700 15px 'Barlow Condensed',Arial,sans-serif;letter-spacing:.1em;cursor:pointer}button:hover{border-color:var(--green)}:focus-visible{outline:2px solid white;outline-offset:3px}.gate button{width:100%;margin-top:12px}.msg{color:var(--mute);font-size:13px;min-height:1.4em;margin-top:10px}.msg.err{color:#ff8a8a}#app{max-width:1480px;margin:auto;padding:clamp(18px,4vw,56px)}header{border-left:8px solid var(--green);padding:0 0 24px 22px;margin-bottom:24px}.eyebrow{display:flex;gap:12px;align-items:center;font:700 13px 'Barlow Condensed',Arial,sans-serif;letter-spacing:.18em;margin-bottom:12px}.tag{color:var(--green);border:1px solid var(--green);padding:5px 8px}h1{margin:0;font:normal clamp(36px,7vw,76px)/.94 'Archivo Black',Impact,sans-serif;letter-spacing:-.04em}.stripes{display:flex;gap:4px;margin:14px 0}.stripes i{width:42px;height:4px}.stripes i:nth-child(1){background:var(--green)}.stripes i:nth-child(2){background:var(--pink)}.stripes i:nth-child(3){background:var(--yellow)}.sub{color:#ddd;font:600 18px/1.4 'Barlow Condensed',Arial,sans-serif}.layout{display:grid;grid-template-columns:minmax(260px,9fr) minmax(250px,7fr);gap:28px;align-items:start}.section-title{font:normal 24px 'Archivo Black',Impact,sans-serif;margin:0 0 12px}.now{font:700 14px 'Barlow Condensed',Arial,sans-serif;letter-spacing:.12em;color:var(--green);min-height:22px;margin:0 0 8px}.frame{position:relative;width:100%;aspect-ratio:9/16;max-height:78svh;background:#000}.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.controls{display:flex;justify-content:flex-end;margin-top:10px}.next{min-width:120px;border-color:var(--pink);color:var(--pink)}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.country{min-height:110px;text-align:left;padding:18px;background:#151515;border:1px solid #333;position:relative}.country strong{display:block;font:normal clamp(21px,3vw,30px) 'Archivo Black',Impact,sans-serif}.country span{display:block;margin-top:10px;color:var(--mute);font:700 12px 'Barlow Condensed',Arial,sans-serif;letter-spacing:.14em}.country:nth-child(2){border-top:3px solid var(--pink)}.country:nth-child(3){border-top:3px solid var(--yellow)}.country:nth-child(4){border-top:3px solid var(--green)}.country:nth-child(1){border-top:3px solid var(--green)}@media(max-width:820px){#app{padding:20px 16px}.layout{grid-template-columns:1fr;gap:30px}.frame{max-height:none;width:min(100%,calc((100svh - 280px)*9/16));margin:auto}.cards{grid-template-columns:1fr 1fr}}@media(max-width:420px){.cards{grid-template-columns:1fr}.country{min-height:88px}}
</style></head><body>
<div class="gate" id="gate"><form id="form" autocomplete="off"><h1>ENTER PASSWORD</h1><input id="pw" type="password" autocomplete="current-password" aria-label="Password" required><button>UNLOCK</button><div id="msg" class="msg" role="status"></div></form></div>
<div id="app" hidden><header><div class="eyebrow"><span class="tag">INTERNAL</span><span>RANKING SERIES</span></div><h1>ASIA MODEL RANKING</h1><div class="stripes" aria-hidden="true"><i></i><i></i><i></i></div><div class="sub">Korea · Japan · Japan Regional · China · Taiwan — monthly rankings from our agency trackers</div></header><div class="layout"><section><h2 class="section-title">FEATURED VIDEO</h2><div class="now" id="now">NOW PLAYING · —</div><div class="frame"><iframe id="video" title="Featured ranking video" allow="autoplay"></iframe></div><div class="controls"><button class="next" id="next">NEXT →</button></div></section><section><h2 class="section-title">COUNTRY RANKINGS</h2><div class="cards"><button class="country" data-country="kr"><strong>KOREA</strong><span>OPEN COUNTRY PAGE ↗</span></button><button class="country" data-country="jp"><strong>JAPAN</strong><span>OPEN COUNTRY PAGE ↗</span></button><button class="country" data-country="jpr"><strong>JAPAN REGIONAL</strong><span>OPEN COUNTRY PAGE ↗</span></button><button class="country" data-country="cn"><strong>CHINA</strong><span>OPEN COUNTRY PAGE ↗</span></button><button class="country" data-country="tw"><strong>TAIWAN</strong><span>OPEN COUNTRY PAGE ↗</span></button></div></section></div></div>
<script>
const $=s=>document.querySelector(s), b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));let last=null,choices=[];
async function verify(password){let errors=[];for(const c of ['kr','jp','cn','tw','jpr']){try{const m=await(await fetch(`./${c}/manifest.json`,{cache:'no-store'})).json(),base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']),key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(m.salt),iterations:m.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']),buf=new Uint8Array(await(await fetch(`./${c}/${m.cfg}`,{cache:'no-store'})).arrayBuffer()),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},key,buf.slice(12));JSON.parse(new TextDecoder().decode(plain));sessionStorage.setItem('rk-pw',password);return true}catch(e){errors.push(e)}}return false}
async function unlock(p){$('#msg').className='msg';$('#msg').textContent='Checking…';if(!await verify(p)){$('#msg').className='msg err';$('#msg').textContent='Wrong password or ranking files unavailable.';return}$('#gate').hidden=true;$('#app').hidden=false;start()}
$('#form').addEventListener('submit',e=>{e.preventDefault();unlock($('#pw').value)});
const videos=[['top10','MODEL TOP 10'],['agency','AGENCY TOP 5'],['newface','NEW FACES BY AGENCY']],countries=[['kr','KOREA'],['jp','JAPAN'],['cn','CHINA']];
function pick(){if(!choices.length)choices=countries.flatMap(([c,n])=>videos.map(([v,t])=>({c,n,v,t})));let eligible=choices;if(last&&choices.length>1){const different=choices.filter(x=>x.c!==last.c||x.v!==last.v);if(different.length)eligible=different}const item=eligible[Math.floor(Math.random()*eligible.length)];choices.splice(choices.indexOf(item),1);last=item;$('#now').textContent=`NOW PLAYING · ${item.n} · ${item.t}`;$('#video').src=`./${item.c}/?embed=1&v=${item.v}`}
function start(){pick();$('#next').onclick=pick;document.querySelectorAll('.country').forEach(b=>b.addEventListener('click',()=>{const url=`./${b.dataset.country}/`,w=window.open(url,'_blank');if(!w)location.href=url}));window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==$('#video').contentWindow||!e.data||e.data.type!=='rk-ended')return;$('#video').contentWindow.postMessage({type:'rk-next'},location.origin);setTimeout(pick,0)})}
const saved=sessionStorage.getItem('rk-pw');if(saved)unlock(saved);
</script></body></html>
